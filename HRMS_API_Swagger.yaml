              type: object
            example:
              companyId: uuid
              name: HQ Branch
              code: HQ
              address: 456 Branch St
              city: Hyderabad
              state: Telangana
              country: India
      responses:
        '200':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
