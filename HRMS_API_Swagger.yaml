openapi: 3.0.3
info:
  title: HRMS Platform API
  description: 'Enterprise HRMS Platform — hire-to-retire SaaS covering 37 HR modules.


    ## Authentication

    All protected endpoints require a Bearer JWT in the `Authorization` header.

    Obtain a token via `POST /api/v1/auth/login`.


    ## Multi-Tenancy

    Include `X-Tenant-Id` header on every request (automatically derived from JWT
    payload).


    ## Default Admin

    Email: `admin@hrms.com` | Password: `Admin@123`'
  version: 1.0.0
  contact:
    name: HRMS Platform Team
servers:
- url: http://localhost:3000
  description: Local Development
- url: https://api.hrms.example.com
  description: Production
tags:
- name: System
  description: Health check
- name: Auth
  description: Authentication — login, refresh, logout
- name: Organization
  description: Companies, branches, departments, designations, grades, cost centers
- name: Employees
  description: Employee CRUD and status management
- name: Attendance
  description: Clock in/out, manual entries, corrections, period locks
- name: Leave
  description: Leave types, holidays, applications, balances
- name: Shifts & Overtime
  description: Shift definitions, rosters, overtime requests
- name: Payroll
  description: Salary components, structures, payroll runs, expense claims
- name: Recruitment
  description: Requisitions, jobs, candidates, interviews, offers
- name: Training
  description: Training programs, sessions, certifications
- name: Performance
  description: Goals, appraisals, feedback, reviews, probation
- name: Compensation
  description: Review cycles, bonuses, loans, variable pay, CTC revisions
- name: Travel & Expense
  description: Travel requests, expenses, advances
- name: Compliance
  description: Calendar, filings, reports, checklist, documents
- name: Policies
  description: Policy management and employee acknowledgement
- name: Operations
  description: Performance cycles, assets, grievances, disciplinary, exits
- name: Helpdesk
  description: Support tickets, comments, CSAT
- name: AI Assistant
  description: AI-powered HR assistant
- name: Automation
  description: Workflow automation
- name: Reports
  description: Custom report builder
- name: API Integration
  description: API keys and webhooks
- name: Form Builder
  description: Dynamic HR forms
- name: Templates
  description: Document/email templates
- name: Biometric
  description: Biometric device management
- name: Statutory
  description: PF, ESI, TDS calculations
- name: Benefits
  description: Employee benefits policies and claims
- name: Assets
  description: Asset inventory and allocations
- name: Exit Management
  description: Resignation, clearance, FnF, exit interviews
- name: Grievance
  description: Grievance management
- name: Disciplinary
  description: Disciplinary case management
- name: Analytics
  description: HR analytics and reports
- name: Contractors
  description: Contract workforce management
- name: Onboarding
  description: Employee onboarding and BGV
- name: Governance & NFR
  description: Feature flags, system health, NFR metrics, audit logs
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /api/v1/auth/login
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
    PaginatedMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
            requestId:
              type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: admin@hrms.com
        password:
          type: string
          example: Admin@123
    Employee:
      type: object
      properties:
        id:
          type: string
        employeeCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum:
          - Male
          - Female
          - Other
        dateOfJoining:
          type: string
          format: date
        employmentType:
          type: string
        status:
          type: string
          enum:
          - Active
          - Inactive
          - Terminated
        companyId:
          type: string
        departmentId:
          type: string
        designationId:
          type: string
        tenantId:
          type: string
        createdAt:
          type: string
          format: date-time
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        registrationNumber:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        industry:
          type: string
        tenantId:
          type: string
    LeaveApplication:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        leaveTypeId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - Pending
          - Approved
          - Rejected
          - Cancelled
        reason:
          type: string
    Policy:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        content:
          type: string
        status:
          type: string
          enum:
          - Draft
          - Published
          - Archived
        effectiveDate:
          type: string
          format: date
        requiresAcknowledgement:
          type: boolean
    Ticket:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
        status:
          type: string
          enum:
          - Open
          - In Progress
          - Resolved
          - Closed
        createdAt:
          type: string
          format: date-time
  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    companyIdPath:
      name: companyId
      in: path
      required: true
      schema:
        type: string
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    X-Tenant-Id:
      description: Tenant identifier for multi-tenancy routing
      schema:
        type: string
paths:
  /health:
    get:
      summary: Health Check
      tags:
      - System
      description: Returns API health status, version and uptime
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
  /api/v1/auth/login:
    post:
      summary: Login
      tags:
      - Auth
      security: []
      description: Authenticate with email and password. Returns JWT access token
        (15 min) and refresh token (7 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: admin@hrms.com
              password: Admin@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      tenantId:
                        type: string
                      user:
                        $ref: '#/components/schemas/Employee'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              refreshToken: <refresh_token>
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      summary: Forgot Password
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: user@hrms.com
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Logout
      tags:
      - Auth
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Get Current User
      tags:
      - Auth
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Employee'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/organization/companies:
    get:
      summary: List Companies
      tags:
      - Organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Companies list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Company
      tags:
      - Organization
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Acme Corp
              registrationNumber: REG123
              address: 123 Main St
              city: Hyderabad
              state: Telangana
              country: India
              industry: Technology
              employeeCount: 100
      responses:
        '200':
          description: Company created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/organization/companies/{companyId}:
    get:
      summary: Get Company
      tags:
      - Organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/companyIdPath'
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Company'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Company
      tags:
      - Organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/companyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Acme Corp Updated
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Company'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Company
      tags:
      - Organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/companyIdPath'
      responses:
        '200':
          description: Company deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/organization/companies/{companyId}/branches:
    get:
      summary: List Branches
      tags:
      - Organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/companyIdPath'
      responses:
